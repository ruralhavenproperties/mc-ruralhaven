<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2463" />
      <stop offset="100%" stop-color="#6B7D3A" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#gradient)" opacity="0.9"/>

  <!-- Satellite dish base -->
  <ellipse cx="50" cy="50" rx="30" ry="15" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Dish parabolic curve -->
  <path d="M 30 50 Q 50 30, 70 50" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Central receiver -->
  <circle cx="50" cy="40" r="4" fill="#ffffff"/>

  <!-- Support legs -->
  <line x1="35" y1="55" x2="45" y2="65" stroke="#ffffff" stroke-width="2"/>
  <line x1="50" y1="55" x2="50" y2="65" stroke="#ffffff" stroke-width="2"/>
  <line x1="65" y1="55" x2="55" y2="65" stroke="#ffffff" stroke-width="2"/>

  <!-- Signal waves -->
  <circle cx="50" cy="40" r="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.7"/>
  <circle cx="50" cy="40" r="20" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
</svg>
