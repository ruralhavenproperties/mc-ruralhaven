<script>
    // Update toolbar clock
    function updateToolbarClock() {
        const now = new Date();
        const timeString = now.toLocaleTimeString('en-US', {
            hour12: true,
            hour: '2-digit',
            minute: '2-digit'
        });
        const dateString = now.toLocaleDateString('en-US', {
            month: 'short',
            day: 'numeric'
        });
        
        const clockElement = document.getElementById('toolbar-clock');
        if (clockElement) {
            clockElement.innerHTML = `<i class="bi bi-clock"></i> ${dateString} ${timeString}`;
        }
    }
    
    // Highlight current page
    function highlightCurrentPage() {
        const currentPath = window.location.pathname;
        const toolbarButtons = document.querySelectorAll('.toolbar-btn');
        
        toolbarButtons.forEach(btn => {
            const href = btn.getAttribute('href');
            if (href && currentPath.includes(href.replace('/', ''))) {
                btn.classList.add('active');
            }
        });
    }
    
    // Initialize
    updateToolbarClock();
    setInterval(updateToolbarClock, 60000);
    highlightCurrentPage();
    
    // Add body padding for toolbar
    document.body.style.paddingTop = '60px';
</script>
