name = "ruralhaven"
compatibility_date = "2024-09-01"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "TRADING_KV"
id = "7897be3dd02240bcb61bcccc33ad6ec1"

# API_KEY is a Worker secret, read in code as env.API_KEY.
# Do not put it in [vars] or commit the value.
#   npx wrangler secret put API_KEY
# Local dev: set API_KEY in .dev.vars (gitignored).
